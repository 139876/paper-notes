var CANVAS={w:1344,h:800};
var root=document.getElementById('msdp-root');
function setBox(id,x,y,w,h){
  var r=document.getElementById(id), hr=document.getElementById(id+'h');
  if(!r)return; r.setAttribute('x',x); r.setAttribute('y',y); r.setAttribute('width',w); r.setAttribute('height',h);
  if(hr){hr.setAttribute('x',x);hr.setAttribute('y',y);hr.setAttribute('width',w);hr.setAttribute('height',h);}
}
function path(vals,step){
  var d='', pen=false;
  for(var i=0;i<vals.length;i++){
    var v=vals[i];
    if(v===null||v===undefined){pen=false;continue;}
    if(!pen){d+='M'+i+','+v;pen=true;}
    else if(step){d+='L'+i+','+vals[i-1]+' L'+i+','+v;}
    else {d+='L'+i+','+v;}
  }
  return d;
}
function render(lvl){
  var s=DATA[lvl]; if(!s)return;
  document.getElementById('msdp-near').src='data:image/png;base64,'+(window.__A||{})['near_'+lvl];
  document.getElementById('msdp-bilin').src='data:image/png;base64,'+(window.__A||{})['bilin_'+lvl];
  var x=(s.cj-3)*s.csx, y=(s.ci-3)*s.csy, w=7*s.csx, h=7*s.csy;
  var bx=Math.max(0,x), by=Math.max(0,y), bw=Math.min(CANVAS.w,x+w)-bx, bh=Math.min(CANVAS.h,y+h)-by;
  ['msdp-box','msdp-boxn','msdp-boxb'].forEach(function(id){setBox(id,bx,by,bw,bh);});
  var all=s.prof_n.filter(function(v){return v!==null;}).concat(s.prof_b.filter(function(v){return v!==null;}));
  if(!all.length) all=[0,1];
  var lo=Math.min.apply(null,all), hi=Math.max.apply(null,all);
  if(hi-lo<1e-6){hi=lo+1;}
  var pad=(hi-lo)*0.18+0.5; lo=Math.max(0,lo-pad); hi=hi+pad;
  var X0=70,X1=930,Y0=20,Y1=150;
  var px=function(i){return X0+(X1-X0)*i/6;};
  var py=function(v){return Y1-(Y1-Y0)*(v-lo)/(hi-lo);};
  var grid=document.getElementById('msdp-prof-grid'); grid.innerHTML='';
  for(var t=0;t<=4;t++){
    var v=lo+(hi-lo)*t/4, y=py(v);
    grid.innerHTML+='<line x1="'+X0+'" y1="'+y+'" x2="'+X1+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>'
      +'<text class="msdp-ax" x="'+(X0-8)+'" y="'+(y+4)+'" text-anchor="end">'+v.toFixed(1)+'</text>';
  }
  document.getElementById('msdp-pn').setAttribute('d',path(s.prof_n.map(function(v){return v===null?null:py(v);}),true));
  document.getElementById('msdp-pb').setAttribute('d',path(s.prof_b.map(function(v){return v===null?null:py(v);}),false));
  var pts=document.getElementById('msdp-prof-pts'); pts.innerHTML='';
  s.prof_n.forEach(function(v,i){if(v!==null){pts.innerHTML+='<circle cx="'+px(i)+'" cy="'+py(v)+'" r="3.2" fill="var(--viz-series-1)"/>';}});
  var xt=document.getElementById('msdp-prof-xt'); xt.innerHTML='';
  for(var i=0;i<7;i++){xt.innerHTML+='<text class="msdp-ax" x="'+px(i)+'" y="'+(Y1+18)+'" text-anchor="middle">'+(i-3)+'</text>';}
  var comp=Math.round((1-((s.br[1]-s.br[0])/Math.max(s.nr[1]-s.nr[0],1e-6)))*100);
  document.getElementById('msdp-detail').textContent =
    lvl+' · stride '+s.stride+' · 深度图 '+s.w+'×'+s.h+' · 感受野 7×7 特征格 = 原图 '
    +Math.round(s.rfw)+'×'+Math.round(s.rfh)+' 像素 · 感受野内深度范围：nearest '
    +s.nr[0]+'–'+s.nr[1]+' m，bilinear '+s.br[0]+'–'+s.br[1]+' m（极差压缩 '+comp+'%）';
  ['P3','P4','P5','P6','P7'].forEach(function(k){
    var b=document.getElementById('msdp-tab-'+k); if(!b)return;
    var on=(k===lvl);
    b.setAttribute('aria-selected',on?'true':'false');
    if(on){b.classList.add('active');}else{b.classList.remove('active');}
  });
