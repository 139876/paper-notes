var A=DATA.assets, S=DATA.samples, M=DATA.meta;
function b64(k){ return 'data:image/png;base64,'+A[k]; }
function b64j(k){ return 'data:image/jpeg;base64,'+A[k]; }
var cur=S[0].id;
function render(id){
  var s=null; for(var i=0;i<S.length;i++){ if(S[i].id===id) s=S[i]; }
  if(!s) return;
  document.getElementById('df-clear').src=b64j('clear_'+id);
  document.getElementById('df-hazy').src=b64j('hazy_'+id);
  document.getElementById('df-depth').src=b64j('depth_'+id);
  var other=S[0].id===id?S[S.length-1].id:S[0].id;
  var o=null; for(var j=0;j<S.length;j++){ if(S[j].id===other) o=S[j]; }
  document.getElementById('df-detail').textContent =
    '样本 '+s.id+' · d_max = '+s.dmax+' m · 该图 65535 = '+s.dmax+' m，'
    +'而样本 '+o.id+' 的 65535 = '+o.dmax+' m —— 同一个 PNG 数值，物理距离差 '
    +Math.round(Math.abs(o.dmax-s.dmax))+' m。深度中位数 '+s.p50+' m，'
    +'5%~95% 区间 '+s.p5+'~'+s.p95+' m。';
  var bars=document.getElementById('df-bars'); bars.innerHTML='';
  var X0=48,X1=884,Y0=8,Y1=132,maxC=Math.max.apply(null,M.hist);
  var bw=(X1-X0)/M.hist.length;
  for(var k=0;k<M.hist.length;k++){
    var h=M.hist[k]/maxC*(Y1-Y0);
    var x=X0+k*bw;
    var isCur = s.dmax>=M.edges[k] && s.dmax<M.edges[k+1];
    bars.innerHTML+='<rect x="'+(x+1).toFixed(2)+'" y="'+(Y1-h).toFixed(2)+'" width="'+(bw-2).toFixed(2)+'" height="'+h.toFixed(2)+'" fill="'+(isCur?'var(--viz-series-1)':'var(--muted)')+'"/>';
  }
  var px=X0+(X1-X0)*(s.dmax-M.edges[0])/(M.edges[M.edges.length-1]-M.edges[0]);
  document.getElementById('df-mark').setAttribute('x1',px.toFixed(2));
  document.getElementById('df-mark').setAttribute('x2',px.toFixed(2));
  document.getElementById('df-marklab').setAttribute('x',px.toFixed(2));
  document.getElementById('df-marklab').textContent=s.dmax+' m';
  S.forEach(function(x){
    var b=document.getElementById('df-tab-'+x.id); if(!b)return;
    var on=(x.id===id);
    b.setAttribute('aria-selected',on?'true':'false');
    if(on){b.classList.add('active');}else{b.classList.remove('active');}
  });
}
S.forEach(function(x){
  var b=document.getElementById('df-tab-'+x.id); if(!b)return;
  b.addEventListener('click',function(){ cur=x.id; render(x.id); });
});
render(cur);
